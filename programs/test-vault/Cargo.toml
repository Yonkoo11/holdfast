[package]
name = "test-vault"
version = "0.1.0"
description = "Deliberately small Holdfast integration target"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "test_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }

