<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holdfast marks</title>
  <style>
    :root { color-scheme: dark; --base:#0b0e11; --iron:#11161a; --paper:#ece8df; --brass:#c9a86a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--base); color:var(--paper); font:14px ui-monospace, monospace; }
    main { width:min(920px, calc(100% - 48px)); display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
    figure { margin:0; min-height:280px; display:grid; place-items:center; align-content:center; gap:32px; background:var(--iron); box-shadow:inset 0 0 0 1px rgba(201,168,106,.18), 0 16px 48px rgba(0,0,0,.32); }
    .sizes { display:flex; align-items:center; gap:24px; color:var(--brass); }
    img { display:block; color:var(--brass); filter:invert(77%) sepia(23%) saturate(725%) hue-rotate(358deg) brightness(88%); }
    .large { width:96px; height:96px; }
    .small { width:16px; height:16px; }
    figcaption { color:#96938b; letter-spacing:.08em; text-transform:uppercase; }
    @media (max-width:700px) { main { grid-template-columns:1fr; padding:24px 0; } figure { min-height:220px; } }
  </style>
</head>
<body>
  <main>
    <figure><div class="sizes"><img class="large" src="mark-1-twin-brace.svg" alt=""><img class="small" src="mark-1-twin-brace.svg" alt=""></div><figcaption>01 / Twin brace</figcaption></figure>
    <figure><div class="sizes"><img class="large" src="mark-2-opposed-dogs.svg" alt=""><img class="small" src="mark-2-opposed-dogs.svg" alt=""></div><figcaption>02 / Opposed dogs</figcaption></figure>
    <figure><div class="sizes"><img class="large" src="mark-3-keel-clamp.svg" alt=""><img class="small" src="mark-3-keel-clamp.svg" alt=""></div><figcaption>03 / Keel clamp</figcaption></figure>
  </main>
</body>
</html>
